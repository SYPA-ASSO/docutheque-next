<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90">
  <rect width="340" height="90" fill="#0f2d6e"/>
  <!-- Filet or -->
  <rect x="8" y="10" width="4" height="70" rx="2" fill="#c8a84b"/>
  <!-- Initiales CP -->
  <text x="20" y="72" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="white" font-weight="400" letter-spacing="4">CP</text>
  <!-- Séparateur vertical léger -->
  <rect x="116" y="12" width="1" height="66" rx="0.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Cabinet -->
  <text x="128" y="32" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.45)" font-weight="600" letter-spacing="3.5">CABINET</text>
  <!-- Cholez-Pagotto -->
  <text x="127" y="58" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" fill="white" font-weight="700" letter-spacing="1">CHOLEZ-PAGOTTO</text>
  <!-- Tagline -->
  <text x="128" y="76" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#c8a84b" font-weight="600" letter-spacing="1.5">COMPRENDRE · DÉCIDER · AGIR</text>
</svg>
